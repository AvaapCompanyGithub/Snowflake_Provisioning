definition_version: 2
entities:
  streamlit_app:
    type: streamlit
    meta:
      use_mixins:
        - streamlit_shared
    identifier:
      database: UTIL_DB
      schema: STREAMLIT
      name: SNOWFLAKE_PROVISIONING
mixins:
  streamlit_shared:
    title: Snowflake Provisioning
    query_warehouse: ADMIN_WH
    compute_pool: SYSTEM_COMPUTE_POOL_CPU
    runtime_name: SYSTEM$ST_CONTAINER_RUNTIME_PY3_11
    execute_as: OWNER
    grants:
      - privilege: USAGE
        role: SYSADMIN
        with_grant_option: true
    idle_auto_shutdown_time_seconds: 86400
    schedules:
      cron_exprs:
        - 0 8 * * 1,2,3,4,5
      timezone: America/New_York
    main_file: snowflake_provisioning.py
    artifacts:
      - pyproject.toml
      - snowflake_provisioning.py
      - .streamlit/config.toml
      - config.json
